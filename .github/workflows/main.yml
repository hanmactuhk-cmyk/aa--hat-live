name: Windows Release x64
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Electron dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate source
        run: npm run check
      - name: Configure native Release x64
        run: cmake -S native -B build/native -A x64
      - name: Build native audio
        run: cmake --build build/native --config Release --parallel 2
      - name: Native DSP self-test
        run: ./build/native/Release/hn-dsp-selftest.exe
      - name: Native ASIO routing self-test
        run: ./build/native/Release/hn-routing-selftest.exe
      - name: Native bus isolation, pitch correction and Auto Vocal regression
        run: ./build/native/Release/hn-audio-regression.exe
      - name: Native multitrack recording and mix export test
        run: ./build/native/Release/hn-audio.exe --timeline-self-test
      - name: Electron popup and control smoke test
        run: node tests/run-ui-smoke.cjs
      - name: Native backend startup smoke test
        run: node tests/backend-smoke.cjs
      - name: Package Electron
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packaged backend
        shell: pwsh
        run: |
          if (!(Test-Path dist/win-unpacked/resources/native/hn-audio.exe)) { throw "Native backend missing" }
          $exe = Get-ChildItem dist/*.exe
          if ($exe.Count -lt 2) { throw "Installer or portable EXE missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: HNStudio-Musik-AI-Windows-x64
          path: |
            dist/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: HNStudio-UI-Preview
          path: build/ui/*.png
          if-no-files-found: error
